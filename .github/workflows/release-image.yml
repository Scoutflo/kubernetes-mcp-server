name: Release as container image

on:
  push:
    branches:
      - mainv2
      - release/dev
    tags:
      - '*'

jobs:
  test:
    name: Tests the build and caches the layers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Test build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  build-pre-prod:
    needs: [test]
    name: Build and push the pre-prod image to the ECR registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/release/dev'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Docker meta tags
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}
          labels: |
            maintainer=${{ github.actor }}
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.description="Docker image for ${{ github.repository }}"
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.documentation=${{ github.repositoryUrl }}/blob/release/dev/README.md
          tags: |
            type=raw,value=pre-prod-${{ github.run_number }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  build-prod:
    needs: [test]
    name: Build and push the production image to the ECR registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/mainv2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Docker meta tags
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_PROD }}
          labels: |
            maintainer=${{ github.actor }}
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.description="Docker image for ${{ github.repository }}"
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.documentation=${{ github.repositoryUrl }}/blob/mainv2/README.md
          tags: |
            type=raw,value=production-${{ github.run_number }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy-pre-prod:
    name: Deploy pre-prod image to GCP VM
    needs: [build-pre-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/release/dev'
    steps:
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Deploy to GCP VM
        run: |
          gcloud compute ssh static-k8s-mcp-server \
            --quiet \
            --zone="asia-south2-a" \
            --tunnel-through-iap \
            --command="
              # 1. Self-bootstrap environment
              if ! command -v aws &>/dev/null; then
                sudo apt-get update && sudo apt-get install -y unzip
                curl -sS 'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip' -o 'awscliv2.zip'
                unzip -q awscliv2.zip
                sudo ./aws/install
                rm -rf aws awscliv2.zip
              fi

              # 2. Grant docker permissions
              if ! groups | grep -q 'docker'; then
                sudo usermod -aG docker \$USER
              fi

              export ECR_IMAGE='${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:pre-prod-${{ github.run_number }}'
              export AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}'
              export AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}'
              export AWS_REGION='${{ secrets.AWS_REGION }}'

              # 3. Login to ECR and Deploy
              aws ecr get-login-password --region \$AWS_REGION | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
              sudo docker pull \$ECR_IMAGE
              sudo docker stop kubernetes-mcp-server || true
              sudo docker rm kubernetes-mcp-server || true
              sudo docker network create k8s-mcp-network || true
              sudo docker run -d --name kubernetes-mcp-server \
                --restart unless-stopped \
                --network k8s-mcp-network \
                -p 8081:8081 \
                -p 8082:8082 \
                -e AZURE_OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
                -e AZURE_OPENAI_ENDPOINT='${{ secrets.OPENAI_ENDPOINT }}' \
                -e AZURE_OPENAI_DEPLOYMENT_NAME='${{ secrets.OPENAI_DEPLOYMENT_NAME }}' \
                -e OPENAI_API_VERSION='${{ secrets.OPENAI_API_VERSION }}' \
                -e AZURE_OPENAI_MAX_TOKENS='${{ secrets.OPENAI_MAX_TOKENS }}' \
                -e AZURE_OPENAI_TEMPERATURE='${{ secrets.OPENAI_TEMPERATURE }}' \
                -e AZURE_OPENAI_TOP_P='${{ secrets.OPENAI_TOP_P }}' \
                \$ECR_IMAGE
            "

  deploy-prod:
    name: Deploy prod image to GCP VM
    needs: [build-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/mainv2'
    steps:
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Deploy to GCP VM
        run: |
          gcloud compute ssh static-k8s-mcp-server-prod \
            --quiet \
            --zone="asia-south2-a" \
            --tunnel-through-iap \
            --command="
              # 1. Self-bootstrap environment
              if ! command -v aws &>/dev/null; then
                sudo apt-get update && sudo apt-get install -y unzip
                curl -sS 'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip' -o 'awscliv2.zip'
                unzip -q awscliv2.zip
                sudo ./aws/install
                rm -rf aws awscliv2.zip
              fi

              # 2. Grant docker permissions
              if ! groups | grep -q 'docker'; then
                sudo usermod -aG docker \$USER
              fi

              export ECR_IMAGE='${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_PROD }}:production-${{ github.run_number }}'
              export AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}'
              export AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}'
              export AWS_REGION='${{ secrets.AWS_REGION }}'

              # 3. Login to ECR and Deploy
              aws ecr get-login-password --region \$AWS_REGION | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
              sudo docker pull \$ECR_IMAGE
              sudo docker stop kubernetes-mcp-server || true
              sudo docker rm kubernetes-mcp-server || true
              sudo docker network create k8s-mcp-network || true
              sudo docker run -d --name kubernetes-mcp-server \
                --restart unless-stopped \
                --network k8s-mcp-network \
                -p 8081:8081 \
                -p 8082:8082 \
                -e AZURE_OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
                -e AZURE_OPENAI_ENDPOINT='${{ secrets.OPENAI_ENDPOINT }}' \
                -e AZURE_OPENAI_DEPLOYMENT_NAME='${{ secrets.OPENAI_DEPLOYMENT_NAME }}' \
                -e OPENAI_API_VERSION='${{ secrets.OPENAI_API_VERSION }}' \
                -e AZURE_OPENAI_MAX_TOKENS='${{ secrets.OPENAI_MAX_TOKENS }}' \
                -e AZURE_OPENAI_TEMPERATURE='${{ secrets.OPENAI_TEMPERATURE }}' \
                -e AZURE_OPENAI_TOP_P='${{ secrets.OPENAI_TOP_P }}' \
                \$ECR_IMAGE
            "
